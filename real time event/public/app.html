<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TrackWise — Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #050810;
      --surface: #0d1117;
      --card: #111827;
      --card2: #161f2e;
      --border: rgba(99,102,241,0.15);
      --border2: rgba(255,255,255,0.06);
      --accent: #6366f1;
      --accent2: #818cf8;
      --accent3: #c7d2fe;
      --text: #f1f5f9;
      --muted: #64748b;
      --muted2: #94a3b8;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --sidebar-w: 260px;
    }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); display: flex; min-height: 100vh; overflow-x: hidden; overflow-y: auto; }

    /* SIDEBAR */
    .sidebar {
      width: var(--sidebar-w);
      background: var(--surface);
      border-right: 1px solid var(--border2);
      display: flex; flex-direction: column;
      padding: 0;
      flex-shrink: 0;
      position: sticky; top: 0; height: 100vh;
      z-index: 10;
    }
    .sidebar-top {
      padding: 24px 20px 20px;
      border-bottom: 1px solid var(--border2);
    }
    .brand {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 20px;
    }
    .brand-icon {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }
    .brand-name {
      font-family: 'Syne', sans-serif;
      font-size: 18px; font-weight: 800;
      background: linear-gradient(135deg, #fff, var(--accent3));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .user-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      display: flex; align-items: center; gap: 10px;
    }
    .avatar {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Syne', sans-serif;
      font-weight: 700; font-size: 14px;
      flex-shrink: 0;
    }
    .user-info { flex: 1; min-width: 0; }
    .user-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .user-email { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .user-status { display: flex; align-items: center; gap: 4px; font-size: 10px; color: var(--success); margin-top: 2px; }
    .status-dot { width: 5px; height: 5px; background: var(--success); border-radius: 50%; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

    .sidebar-nav { padding: 16px 12px; flex: 1; }
    .nav-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); padding: 0 8px; margin-bottom: 8px; margin-top: 16px; }
    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 12px; border-radius: 8px;
      cursor: pointer; font-size: 13px; color: var(--muted2);
      transition: all 0.2s; margin-bottom: 2px;
    }
    .nav-item:hover { background: rgba(255,255,255,0.04); color: var(--text); }
    .nav-item.active { background: rgba(99,102,241,0.12); color: var(--accent2); }
    .nav-item .nav-icon { font-size: 16px; width: 20px; text-align: center; }
    .nav-badge { margin-left: auto; background: var(--accent); color: #fff; font-size: 10px; padding: 1px 6px; border-radius: 20px; }

    .sidebar-bottom {
      padding: 16px 12px;
      border-top: 1px solid var(--border2);
    }
    .online-panel { margin-bottom: 12px; }
    .online-title { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 8px; }
    .online-list { display: flex; flex-wrap: wrap; gap: 4px; }
    .online-chip {
      display: flex; align-items: center; gap: 4px;
      background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.2);
      border-radius: 20px; padding: 2px 8px;
      font-size: 11px; color: var(--success);
    }
    .logout-btn {
      width: 100%; padding: 9px;
      background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.2);
      border-radius: 8px; color: #fca5a5;
      font-family: 'DM Sans', sans-serif; font-size: 13px;
      cursor: pointer; transition: all 0.2s;
    }
    .logout-btn:hover { background: rgba(239,68,68,0.15); }

    /* MAIN */
    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

    .topbar {
      padding: 20px 28px;
      border-bottom: 1px solid var(--border2);
      display: flex; align-items: center; gap: 16px;
      background: var(--surface);
    }
    .topbar-title { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 700; flex: 1; }
    .topbar-title span { color: var(--muted); font-weight: 400; font-size: 14px; display: block; font-family: 'DM Sans', sans-serif; margin-top: 2px; }
    .sync-indicator {
      display: flex; align-items: center; gap: 6px;
      font-size: 12px; color: var(--success);
      background: rgba(16,185,129,0.08); border: 1px solid rgba(16,185,129,0.2);
      padding: 5px 12px; border-radius: 20px;
    }
    .sync-dot { width: 6px; height: 6px; background: var(--success); border-radius: 50%; animation: pulse 1.5s infinite; }

    .content { flex: 1; overflow-y: auto; padding: 24px 28px; }
    .content::-webkit-scrollbar { width: 5px; }
    .content::-webkit-scrollbar-track { background: transparent; }
    .content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* STATS */
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 24px; }
    .stat-card {
      background: var(--card);
      border: 1px solid var(--border2);
      border-radius: 12px;
      padding: 18px;
      position: relative;
      overflow: hidden;
      transition: border-color 0.2s;
    }
    .stat-card:hover { border-color: var(--border); }
    .stat-card::before {
      content: ''; position: absolute;
      top: 0; left: 0; right: 0; height: 2px;
    }
    .stat-card.total::before { background: linear-gradient(90deg, var(--accent), var(--accent2)); }
    .stat-card.active::before { background: linear-gradient(90deg, var(--success), #34d399); }
    .stat-card.done::before { background: linear-gradient(90deg, var(--warning), #fcd34d); }
    .stat-card.high::before { background: linear-gradient(90deg, var(--danger), #f87171); }
    .stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); margin-bottom: 10px; }
    .stat-value { font-family: 'Syne', sans-serif; font-size: 32px; font-weight: 800; }
    .stat-icon { position: absolute; top: 16px; right: 16px; font-size: 22px; opacity: 0.3; }

    /* ADD EVENT */
    .add-section {
      background: var(--card);
      border: 1px solid var(--border2);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 24px;
    }
    .add-section-title {
      font-family: 'Syne', sans-serif;
      font-size: 15px; font-weight: 700;
      margin-bottom: 16px;
      display: flex; align-items: center; gap: 8px;
    }
    .add-form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .add-form .span-2 { grid-column: span 2; }
    .field-group { display: flex; flex-direction: column; gap: 6px; }
    .field-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); }
    .field-input, .field-select, .field-textarea {
      background: var(--card2);
      border: 1px solid var(--border2);
      border-radius: 8px;
      padding: 9px 12px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      outline: none;
      transition: all 0.2s;
    }
    .field-input:focus, .field-select:focus, .field-textarea:focus {
      border-color: var(--accent);
      background: rgba(99,102,241,0.05);
    }
    .field-input::placeholder, .field-textarea::placeholder { color: var(--muted); opacity: 0.6; }
    .field-select option { background: var(--card); }
    .field-textarea { resize: vertical; min-height: 70px; }
    .add-btn {
      padding: 10px 20px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none; border-radius: 8px;
      color: #fff; font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 700;
      cursor: pointer; transition: all 0.2s;
      align-self: flex-end;
    }
    .add-btn:hover { box-shadow: 0 4px 20px rgba(99,102,241,0.4); transform: translateY(-1px); }

    /* EVENTS */
    .events-header {
      display: flex; align-items: center; gap: 12px; flex-wrap: nowrap;
      margin-bottom: 16px; overflow-x: auto; scrollbar-width: none;
      position: sticky; top: 0; z-index: 5;
      background: var(--bg); padding: 10px 0; margin-top: -10px;
    }
    .events-header::-webkit-scrollbar { display: none; }
    .events-title { font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 700; white-space: nowrap; flex-shrink: 0; margin-right: auto; }
    .filter-tabs { display: flex; gap: 4px; align-items: center; flex-shrink: 0; }
    .filter-tab {
      padding: 5px 12px; border-radius: 6px; flex-shrink: 0;
      border: 1px solid var(--border2);
      background: transparent; color: var(--muted);
      font-size: 12px; cursor: pointer;
      transition: all 0.2s; font-family: 'DM Sans', sans-serif;
    }
    .filter-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .search-box {
      background: var(--card); border: 1px solid var(--border2);
      border-radius: 8px; padding: 6px 12px;
      color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 13px;
      outline: none; width: 200px;
    }
    .search-box:focus { border-color: var(--accent); }
    .search-box::placeholder { color: var(--muted); }

    .events-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
    .event-card {
      background: var(--card);
      border: 1px solid var(--border2);
      border-radius: 12px;
      padding: 16px;
      position: relative;
      transition: all 0.25s;
      animation: card-in 0.4s ease both;
    }
    @keyframes card-in {
      from { opacity: 0; transform: translateY(12px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .event-card:hover { border-color: var(--border); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
    .event-card.new-flash { animation: flash 0.8s ease; }
    @keyframes flash { 0%,100% { border-color: var(--border2); } 50% { border-color: var(--accent); box-shadow: 0 0 20px rgba(99,102,241,0.3); } }

    .event-top { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
    .priority-badge {
      padding: 2px 8px; border-radius: 4px;
      font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px;
      flex-shrink: 0; margin-top: 1px;
    }
    .priority-badge.high { background: rgba(239,68,68,0.15); color: #f87171; }
    .priority-badge.medium { background: rgba(245,158,11,0.15); color: #fcd34d; }
    .priority-badge.low { background: rgba(16,185,129,0.15); color: #6ee7b7; }
    .event-title { font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 600; flex: 1; line-height: 1.3; }
    .event-desc { font-size: 12px; color: var(--muted2); line-height: 1.5; margin-bottom: 12px; }
    .event-meta { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); flex-wrap: wrap; }
    .meta-chip {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border2);
      border-radius: 4px; padding: 2px 6px;
    }
    .event-actions { display: flex; gap: 6px; margin-left: auto; }
    .action-btn {
      width: 26px; height: 26px;
      border: 1px solid var(--border2);
      border-radius: 6px; background: transparent;
      color: var(--muted); cursor: pointer; font-size: 12px;
      transition: all 0.2s; display: flex; align-items: center; justify-content: center;
    }
    .action-btn:hover.complete { border-color: var(--success); color: var(--success); background: rgba(16,185,129,0.1); }
    .action-btn:hover.delete { border-color: var(--danger); color: var(--danger); background: rgba(239,68,68,0.1); }

    .status-completed .event-title { text-decoration: line-through; opacity: 0.5; }

    .creator-info { display: flex; align-items: center; gap: 5px; }
    .mini-avatar {
      width: 16px; height: 16px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 50%;
      font-size: 8px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }

    .empty-state {
      text-align: center; padding: 60px 20px;
      color: var(--muted);
      grid-column: 1/-1;
    }
    .empty-state .empty-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.4; }
    .empty-state p { font-size: 14px; }

    .toast {
      position: fixed; bottom: 24px; right: 24px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px 18px;
      font-size: 13px; z-index: 999;
      animation: toast-in 0.3s ease;
      display: flex; align-items: center; gap: 8px;
      max-width: 300px; box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    @keyframes toast-in { from { opacity:0; transform: translateY(12px); } to { opacity:1; transform:translateY(0); } }

    /* Edit Modal */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
      z-index: 100; display: none;
      align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      width: 480px;
      max-width: 90vw;
      animation: modal-in 0.3s ease;
    }
    @keyframes modal-in { from { opacity:0; transform: scale(0.95); } to { opacity:1; transform:scale(1); } }
    .modal-title { font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 700; margin-bottom: 20px; }
    .modal-actions { display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end; }
    .btn-cancel {
      padding: 9px 18px; border: 1px solid var(--border2); border-radius: 8px;
      background: transparent; color: var(--muted); cursor: pointer;
      font-family: 'DM Sans', sans-serif; font-size: 13px;
    }
    .btn-save {
      padding: 9px 18px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none; border-radius: 8px; color: #fff;
      font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 700;
      cursor: pointer;
    }

    @media (max-width: 900px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .sidebar { width: 220px; }
    }
    @media (max-width: 640px) {
      .sidebar { width: 180px; } /* Keep sidebar visible in grouped windows */
      .add-form { grid-template-columns: 1fr; }
      .add-form .span-2 { grid-column: span 1; }
    }
    @media (max-width: 480px) {
      .sidebar { display: none; } /* Only hide on very small mobile screens */
    }
  </style>
</head>
<body>
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="brand">
        <div class="brand-icon">⚡</div>
        <span class="brand-name">TrackWise</span>
      </div>
      <div class="user-card">
        <div class="avatar" id="sidebar-avatar">JD</div>
        <div class="user-info">
          <div class="user-name" id="sidebar-name">Loading...</div>
          <div class="user-email" id="sidebar-email">...</div>
          <div class="user-status"><span class="status-dot"></span>Online</div>
        </div>
      </div>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-label">Navigation</div>
      <div class="nav-item" id="nav-create-event" onclick="setView('create')">
        <span class="nav-icon">➕</span> Create Event
      </div>
      <div class="nav-item active" id="nav-all-events" onclick="setView('all')">
        <span class="nav-icon">🌐</span> All Events
      </div>
    </nav>

    <div class="sidebar-bottom">
      <div class="online-panel">
        <div class="online-title">🟢 Online Now</div>
        <div class="online-list" id="online-list">
          <span class="online-chip"><span class="status-dot"></span>You</span>
        </div>
      </div>
      <button class="logout-btn" onclick="logout()">⎋ Sign Out</button>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="main">
    <div class="topbar">
      <div class="topbar-title">
        Event Dashboard
        <span id="topbar-sub">Your personal workspace</span>
      </div>
      <div class="sync-indicator">
        <span class="sync-dot"></span>
        <span id="sync-text">Live Sync Active</span>
      </div>
    </div>

    <div class="content">
      <!-- Stats -->
      <div class="stats-grid">
        <div class="stat-card total">
          <div class="stat-label">Total Events</div>
          <div class="stat-value" id="stat-total">0</div>
          <span class="stat-icon">📊</span>
        </div>
        <div class="stat-card active">
          <div class="stat-label">Active</div>
          <div class="stat-value" id="stat-active">0</div>
          <span class="stat-icon">⚡</span>
        </div>
        <div class="stat-card done">
          <div class="stat-label">Completed</div>
          <div class="stat-value" id="stat-done">0</div>
          <span class="stat-icon">✅</span>
        </div>
        <div class="stat-card high">
          <div class="stat-label">High Priority</div>
          <div class="stat-value" id="stat-high">0</div>
          <span class="stat-icon">🔥</span>
        </div>
      </div>

      <!-- Add Event -->
      <div class="add-section" style="display: none;">
        <div class="add-section-title">➕ Create New Event</div>
        <div class="add-form">
          <div class="field-group">
            <label class="field-label">Event Title *</label>
            <input type="text" class="field-input" id="new-title" placeholder="Enter event title..."/>
          </div>
          <div class="field-group">
            <label class="field-label">Category</label>
            <select class="field-select" id="new-category">
              <option value="general">General</option>
              <option value="meeting">Meeting</option>
              <option value="task">Task</option>
              <option value="bug">Bug Fix</option>
              <option value="feature">Feature</option>
              <option value="review">Review</option>
            </select>
          </div>
          <div class="field-group span-2">
            <label class="field-label">Description</label>
            <textarea class="field-textarea" id="new-desc" placeholder="Add more details..."></textarea>
          </div>
          <div class="field-group">
            <label class="field-label">Priority</label>
            <select class="field-select" id="new-priority">
              <option value="low">🟢 Low</option>
              <option value="medium" selected>🟡 Medium</option>
              <option value="high">🔴 High</option>
            </select>
          </div>
          <div class="field-group" style="justify-content:flex-end">
            <label class="field-label">&nbsp;</label>
            <button class="add-btn" onclick="addEvent()">⚡ Add Event</button>
          </div>
        </div>
      </div>

      <!-- Events List -->
      <div id="events-list-container">
        <div class="events-header">
          <div class="events-title" id="events-section-title">My Events</div>
          <div class="filter-tabs">
            <button class="filter-tab active" onclick="setFilter('all', this)">All</button>
            <button class="filter-tab" onclick="setFilter('active', this)">Active</button>
            <button class="filter-tab" onclick="setFilter('completed', this)">Done</button>
            <div style="width: 1px; height: 16px; background: var(--border2); margin: 0 4px; flex-shrink: 0;"></div>
            <button class="filter-tab priority-tab" onclick="filterByPriority('high', this)">🔴 High</button>
            <button class="filter-tab priority-tab" onclick="filterByPriority('medium', this)">🟡 Med</button>
            <button class="filter-tab priority-tab" onclick="filterByPriority('low', this)">🟢 Low</button>
          </div>
          <input type="text" class="search-box" style="flex-shrink: 0;" placeholder="🔍 Search events..." oninput="renderEvents()"/>
        </div>
        <div class="events-grid" id="events-grid">
          <div class="empty-state"><div class="empty-icon">📭</div><p>No events yet. Create your first one!</p></div>
        </div>
      </div>
    </div>
  </main>

  <!-- Edit Modal -->
  <div class="modal-overlay" id="edit-modal">
    <div class="modal">
      <div class="modal-title">✏️ Edit Event</div>
      <input type="hidden" id="edit-id"/>
      <div class="add-form">
        <div class="field-group">
          <label class="field-label">Title</label>
          <input type="text" class="field-input" id="edit-title"/>
        </div>
        <div class="field-group">
          <label class="field-label">Category</label>
          <select class="field-select" id="edit-category">
            <option value="general">General</option>
            <option value="meeting">Meeting</option>
            <option value="task">Task</option>
            <option value="bug">Bug Fix</option>
            <option value="feature">Feature</option>
            <option value="review">Review</option>
          </select>
        </div>
        <div class="field-group span-2">
          <label class="field-label">Description</label>
          <textarea class="field-textarea" id="edit-desc"></textarea>
        </div>
        <div class="field-group">
          <label class="field-label">Priority</label>
          <select class="field-select" id="edit-priority">
            <option value="low">🟢 Low</option>
            <option value="medium">🟡 Medium</option>
            <option value="high">🔴 High</option>
          </select>
        </div>
        <div class="field-group">
          <label class="field-label">Status</label>
          <select class="field-select" id="edit-status">
            <option value="active">Active</option>
            <option value="completed">Completed</option>
            <option value="cancelled">Cancelled</option>
          </select>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">Cancel</button>
        <button class="btn-save" onclick="saveEdit()">Save Changes</button>
      </div>
    </div>
  </div>

  <script>
    // ─── AUTH GUARD ───────────────────────────────────────
    const token = localStorage.getItem('tw_token');
    const user = JSON.parse(localStorage.getItem('tw_user') || 'null');
    // 🔐 Hide Add Event for non-admin
    if (user.role !== "admin") {
      const navCreate = document.getElementById('nav-create-event');
      if (navCreate) navCreate.style.display = 'none';
      const addSec = document.querySelector('.add-section');
      if (addSec) addSec.style.display = 'none';
    }
    if (!token || !user) { window.location.href = '/'; }

    // ─── STATE ────────────────────────────────────────────
    let events = [];
    let currentView = 'all';
    let currentFilter = 'all';
    let priorityFilter = null;

    document.getElementById('events-section-title').textContent = 'All Events';
    document.getElementById('topbar-sub').textContent = 'All team events';

    // ─── INIT USER UI ─────────────────────────────────────
    const initials = user.full_name.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
    document.getElementById('sidebar-avatar').textContent = initials;
    document.getElementById('sidebar-name').textContent = user.full_name;
    document.getElementById('sidebar-email').textContent = user.email;

    // ─── SOCKET.IO ────────────────────────────────────────
    const socket = io({
      auth: {
        token: localStorage.getItem('tw_token')
      }
    });

    socket.on('new_event', (ev) => {
      const exists = events.some(e => e.id === ev.id);
      if (!exists) {
        events.unshift(ev);
      }
      renderEvents();
      loadStats();
      // Flash effect on new event from others
      if (ev.user_id !== user.id) {
        showToast(`⚡ ${ev.creator_name} added "${ev.title}"`, 'info');
        setTimeout(() => {
          const card = document.querySelector(`[data-id="${ev.id}"]`);
          if (card) card.classList.add('new-flash');
        }, 100);
      }
    });

    socket.on('update_event', (updated) => {
      events = events.map(e => e.id === updated.id ? { ...e, ...updated } : e);
      renderEvents(); loadStats();
    });

    socket.on('delete_event', ({ id }) => {
      events = events.filter(e => e.id !== id);
      renderEvents(); loadStats();
    });

    socket.on('online_users', (users) => {
      const list = document.getElementById('online-list');
      list.innerHTML = users.map(u =>
        `<span class="online-chip"><span class="status-dot"></span>${u.id === user.id ? 'You' : u.name.split(' ')[0]}</span>`
      ).join('');
    });

    // ─── API HELPER ───────────────────────────────────────
    async function api(method, url, body) {
      const res = await fetch(url, {
        method,
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: body ? JSON.stringify(body) : undefined
      });
      if (res.status === 401 || res.status === 403) { logout(); return null; }
      return res.json();
    }

    // ─── LOAD DATA ────────────────────────────────────────
    async function loadEvents() {
      events = [];   // 👈 ADD THIS
      const data = await api('GET', '/events');
      if (data) {
        events = [...data];   // force new array
        renderEvents();
        loadStats();
      }
    }

    function loadStats() {
      const visibleEvents = events.filter(e => currentView === 'all' || e.user_id === user.id);
      
      const total = visibleEvents.length;
      const active = visibleEvents.filter(e => e.status === 'active').length;
      const completed = visibleEvents.filter(e => e.status === 'completed').length;
      const high = visibleEvents.filter(e => e.priority === 'high').length;
      
      document.getElementById('stat-total').textContent = total;
      document.getElementById('stat-active').textContent = active;
      document.getElementById('stat-done').textContent = completed;
      document.getElementById('stat-high').textContent = high;
    }

    // ─── RENDER ───────────────────────────────────────────
    function renderEvents() {
      const grid = document.getElementById('events-grid');
      const searchVal = document.querySelector('.search-box').value.toLowerCase();

      let filtered = events.filter(e => {
  const matchFilter = currentFilter === 'all' || e.status === currentFilter;
  const matchPriority = !priorityFilter || e.priority === priorityFilter;
  const matchSearch = !searchVal || 
    e.title.toLowerCase().includes(searchVal) || 
    (e.description||'').toLowerCase().includes(searchVal);

  return matchFilter && matchPriority && matchSearch;
});

      if (!filtered.length) {
        grid.innerHTML = `<div class="empty-state"><div class="empty-icon">📭</div><p>No events match your filter.</p></div>`;
        return;
      }

      grid.innerHTML = filtered.map((e, i) => {
        const initials = (e.creator_name||'?').split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
        const isOwn = e.user_id === user.id;
        const date = new Date(e.created_at).toLocaleDateString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
        return `
        <div class="event-card status-${e.status}" data-id="${e.id}" style="animation-delay:${i*0.04}s">
          <div class="event-top">
            <span class="priority-badge ${e.priority}">${e.priority}</span>
            <span class="event-title">${escHtml(e.title)}</span>
            ${isOwn ? `
            <div class="event-actions">
              <button class="action-btn complete" onclick="completeEvent(${e.id}, '${e.status}')" title="${e.status==='completed'?'Reopen':'Complete'}">
                ${e.status === 'completed' ? '↩' : '✓'}
              </button>
              <button class="action-btn" onclick="openEdit(${e.id})" title="Edit">✏</button>
              <button class="action-btn delete" onclick="deleteEvent(${e.id})" title="Delete">✕</button>
            </div>` : ''}
          </div>
          ${e.description ? `<div class="event-desc">${escHtml(e.description)}</div>` : ''}
          <div class="event-meta">
            <span class="meta-chip">📁 ${e.category||'general'}</span>
            <span class="meta-chip" style="color:${e.status==='completed'?'var(--success)':e.status==='cancelled'?'var(--danger)':'var(--warning)'}">
              ${e.status}
            </span>
            <span class="creator-info">
              <span class="mini-avatar">${initials}</span>
              ${escHtml(e.creator_name||e.username||'')}
            </span>
            <span style="margin-left:auto; font-size:10px; opacity:0.5">${date}</span>
          </div>
        </div>`;
      }).join('');
    }

    function escHtml(s) {
      return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // ─── ACTIONS ──────────────────────────────────────────
    async function addEvent() {
      const title = document.getElementById('new-title').value.trim();
      const description = document.getElementById('new-desc').value.trim();
      const priority = document.getElementById('new-priority').value;
      const category = document.getElementById('new-category').value;
      if (!title) { showToast('⚠️ Title is required.', 'error'); return; }

      const data = await api('POST', '/events', { title, description, priority, category });
      if (data && !data.error) {
        document.getElementById('new-title').value = '';
        document.getElementById('new-desc').value = '';
        showToast('✅ Event created!', 'success');
        
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById('nav-all-events').classList.add('active');
        setView('all');
      } else if (data) {
        showToast('❌ ' + data.error, 'error');
      }
    }

    async function deleteEvent(id) {
      if (!confirm('Delete this event?')) return;
      await api('DELETE', `/events/${id}`);
    }

    async function completeEvent(id, currentStatus) {
      const ev = events.find(e => e.id === id);
      if (!ev) return;
      
      const newStatus = currentStatus === 'completed' ? 'active' : 'completed';
      
      const data = await api('PUT', `/events/${id}`, {
        title: ev.title, description: ev.description,
        priority: ev.priority, category: ev.category,
        status: newStatus
      });

      if (data && !data.error) {
        ev.status = newStatus;
        renderEvents();
        loadStats();
      }
    }

    function openEdit(id) {
      const ev = events.find(e => e.id === id);
      if (!ev) return;
      document.getElementById('edit-id').value = id;
      document.getElementById('edit-title').value = ev.title;
      document.getElementById('edit-desc').value = ev.description || '';
      document.getElementById('edit-priority').value = ev.priority;
      document.getElementById('edit-category').value = ev.category || 'general';
      document.getElementById('edit-status').value = ev.status;
      document.getElementById('edit-modal').classList.add('open');
    }

    function closeModal() { document.getElementById('edit-modal').classList.remove('open'); }

    async function saveEdit() {
      const id = document.getElementById('edit-id').value;
      const data = await api('PUT', `/events/${id}`, {
        title: document.getElementById('edit-title').value,
        description: document.getElementById('edit-desc').value,
        priority: document.getElementById('edit-priority').value,
        category: document.getElementById('edit-category').value,
        status: document.getElementById('edit-status').value,
      });
      
      if (data && !data.error) {
        const ev = events.find(e => e.id == id);
        if (ev) {
          ev.title = document.getElementById('edit-title').value;
          ev.description = document.getElementById('edit-desc').value;
          ev.priority = document.getElementById('edit-priority').value;
          ev.category = document.getElementById('edit-category').value;
          ev.status = document.getElementById('edit-status').value;
          renderEvents();
          loadStats();
        }
      }
      closeModal();
      showToast('✅ Event updated!', 'success');
    }

    function setView(v) {
      if (v !== 'create') {
        currentView = v;
      }
      priorityFilter = null;
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      
      const evt = window.event;
      if (evt && evt.currentTarget) {
          evt.currentTarget.classList.add('active');
      }
      
      const addSection = document.querySelector('.add-section');
      const eventsListContainer = document.getElementById('events-list-container');
      const statsGrid = document.querySelector('.stats-grid');
      
      if (v === 'create') {
        if (addSection) addSection.style.display = 'block';
        if (eventsListContainer) eventsListContainer.style.display = 'none';
        if (statsGrid) statsGrid.style.display = 'none';
        document.getElementById('events-section-title').textContent = 'Create Event';
        document.getElementById('topbar-sub').textContent = 'Create a new event';
      } else {
        if (addSection) addSection.style.display = 'none';
        if (eventsListContainer) eventsListContainer.style.display = 'block';
        if (statsGrid) statsGrid.style.display = 'grid';
        document.getElementById('events-section-title').textContent = 'All Events';
        document.getElementById('topbar-sub').textContent = 'All team events';
        loadEvents();
      }
    }

    function filterByPriority(p, btn) {
      priorityFilter = priorityFilter === p ? null : p;
      document.querySelectorAll('.priority-tab').forEach(t => t.classList.remove('active'));
      if (priorityFilter && btn) btn.classList.add('active');
      renderEvents();
    }

    function setFilter(f, btn) {
      currentFilter = f;
      document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      renderEvents();
    }

    function logout() {
      socket.disconnect();
      localStorage.removeItem('tw_token');
      localStorage.removeItem('tw_user');
      window.location.href = '/';
    }

    // ─── TOAST ────────────────────────────────────────────
    let toastTimer;
    function showToast(msg, type = 'info') {
      const existing = document.querySelector('.toast');
      if (existing) existing.remove();
      clearTimeout(toastTimer);
      const t = document.createElement('div');
      t.className = 'toast';
      t.style.borderColor = type === 'success' ? 'rgba(16,185,129,0.3)' : type === 'error' ? 'rgba(239,68,68,0.3)' : 'var(--border)';
      t.textContent = msg;
      document.body.appendChild(t);
      toastTimer = setTimeout(() => t.remove(), 3000);
    }

    // Close modal on overlay click
    document.getElementById('edit-modal').addEventListener('click', e => {
      if (e.target === e.currentTarget) closeModal();
    });

    // Enter key for add event
    document.getElementById('new-title').addEventListener('keydown', e => {
      if (e.key === 'Enter') addEvent();
    });

    // ─── INIT ────────────────────────────────────────────
    socket.on("connect", () => {
      loadEvents();
    });
    loadStats();
  </script>
</body>
</html>
